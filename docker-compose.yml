# ============================================================================
# Aviothic Breast Cancer Report Copilot — Docker Compose (Development)
# ============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount source for live reload in development
      - ./src:/app/src:ro
      - ./uploads:/app/uploads
    environment:
      - AVIOTHIC_ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
