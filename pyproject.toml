[project]
name = "aviothic-breast-copilot"
version = "0.1.0"
description = "AI-powered breast cancer report copilot — structured extraction, grounded Q&A, and clinical summaries."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "Aviothic Clinical AI Systems" }]

dependencies = [
    # --- API ---
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.12",

    # --- PDF Parsing & OCR ---
    "pymupdf>=1.24,<2.0",
    "pdfplumber>=0.11,<1.0",
    "pytesseract>=0.3.13,<0.4",
    "pillow>=10.0,<13.0",

    # --- Data Validation ---
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",

    # --- Logging ---
    "structlog>=24.0,<26.0",

    # --- Config ---
    "python-dotenv>=1.0,<2.0",

    # --- LangChain & LangGraph (RAG & Agent Orchestration) ---
    "langchain>=0.3.0,<0.4.0",
    "langgraph>=0.2.0,<0.3.0",
    "langchain-community>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
dev = [
    # --- Testing ---
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "pytest-cov>=5.0,<6.0",
    "fpdf2>=2.8,<3.0",

    # --- Linting & Formatting ---
    "black>=24.10,<26.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------- Black ----------
[tool.black]
line-length = 120
target-version = ["py312"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "B",   # flake8-bugbear
]
ignore = [
    "S104", # Possible binding to all interfaces — intentional for Docker
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz.*", "pdfplumber.*", "pytesseract.*", "langchain.*", "langgraph.*", "langchain_community.*"]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
